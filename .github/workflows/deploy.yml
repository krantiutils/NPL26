name: Deploy NPL26

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Download and verify game assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download assets-v1 --repo "$GITHUB_REPOSITORY" --pattern 'npl26-assets.tar' --pattern 'npl26-assets.tar.sha256'
          sha256sum --check npl26-assets.tar.sha256
          tar -xf npl26-assets.tar -C site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
