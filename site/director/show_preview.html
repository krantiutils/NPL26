<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kaka preview</title>
<link rel="stylesheet" href="persona.css">
<style>
  /* a stand-in for the game picture, so composition can be judged */
  body { margin: 0; background: #071018; font: 12px ui-monospace, Menlo, monospace; color: #fff; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; }
  #pitch { position: absolute; inset: 0;
    background:
      radial-gradient(120% 90% at 50% 10%, #2f6b3a 0%, #1d4a2a 45%, #12331d 100%);
  }
  #ball { position: absolute; left: 46%; top: 52%; width: 14px; height: 14px; border-radius: 50%;
    background: #d8d8d8; box-shadow: 0 0 12px rgba(255,255,255,.6); }
  /* fake broadcast furniture */
  #score { position: absolute; left: 24px; top: 24px; display: flex; gap: 14px; align-items: center;
    background: #0b1b2b; border-left: 4px solid #e63329; padding: 8px 14px; }
  #score b { font-size: 18px; letter-spacing: .04em; }
  #score span { color: #9fb6c9; }
  #ticker { position: absolute; left: 24px; bottom: 24px; background: rgba(11,27,43,.9);
    padding: 6px 12px; color: #f5c542; }
  #controls { padding: 14px 24px; display: flex; gap: 10px; }
  button { font: 12px ui-monospace, Menlo, monospace; padding: 6px 12px; background: #13314d;
    color: #fff; border: 1px solid #2a4a68; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>
<div id="stage">
  <div id="pitch"></div>
  <div id="ball"></div>
  <div id="score"><b>JKB 128/3</b><span>16.2 ov · RR 7.8</span></div>
  <div id="ticker">Kaka is looking into something…</div>
</div>

<div id="controls">
  <button id="b-in">enter</button>
  <button id="b-replay">replay panel</button>
  <button id="b-stat">stat panel</button>
  <button id="b-talk">talk (1.6 s)</button>
  <button id="b-out">exit</button>
</div>

<script type="module">
  import { mountPersona } from './persona.js';
  const p = mountPersona(document.getElementById('stage'));

  document.getElementById('b-in').onclick = () => p.enter();
  document.getElementById('b-out').onclick = () => p.exit();
  document.getElementById('b-replay').onclick = () => p
    .openPanel({ kind: 'replay', title: 'FOUR — over the covers', lines: ['Ankit Yadav', '15.4 · JKB 122/3'] });
  document.getElementById('b-stat').onclick = () => p
    .openPanel({ kind: 'stat', title: 'BATTING', lines: ['Rohit Paudel 54 (38)', 'SR 142 · 4x4 2x6', 'vs spin: 28 off 19'] });
  document.getElementById('b-talk').onclick = () => {
    // fake speech envelope, 1.6 s
    const t0 = performance.now();
    (function step() {
      const t = (performance.now() - t0) / 1000;
      if (t > 1.6) { p.setTalking(0); return; }
      p.setTalking(Math.abs(Math.sin(t * 11)) * 0.85);
      requestAnimationFrame(step);
    })();
  };
</script>
</body>
</html>
